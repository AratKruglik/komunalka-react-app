<!doctype html>
<html lang="uk" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Комуналка - Управління комунальними послугами</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      ;(() => {
        const cookieName = 'theme'
        const cookieEntry = document.cookie
          .split('; ')
          .find((row) => row.startsWith(`${cookieName}=`))
        const stored = cookieEntry?.split('=')[1]
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const preference =
          stored === 'dark' || stored === 'light' || stored === 'system' ? stored : 'light'
        const resolved = preference === 'system' ? (systemPrefersDark ? 'dark' : 'light') : preference

        document.documentElement.dataset.theme = resolved
        document.documentElement.style.colorScheme = resolved
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
